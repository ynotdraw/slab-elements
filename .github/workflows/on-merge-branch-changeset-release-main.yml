name: On Merge Branch "changeset-release/main"

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -eu -o pipefail {0}

# Only the Release Preview pull request that Changesets opens from this
# repository releases. A fork's branch can have the same name, so the
# repository is checked as well as the branch.
#
# Each job checks out the merge commit, so what's built is exactly what landed
# on main.
jobs:
  install-dependencies:
    name: Install
    if: github.event.pull_request.merged == true && github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/actions/pnpm

  # The build runs every development dependency, so it gets no permissions
  # beyond reading the repository. The release job only publishes what it
  # built, which keeps npm's publish token out of reach of the build.
  build:
    name: Build
    if: github.event.pull_request.merged == true && github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs:
      - install-dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/actions/pnpm
      - run: pnpm start
        env:
          NODE_ENV: production
      - name: Upload Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist
            !dist/storybook
          if-no-files-found: error
      - name: Upload Storybook
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook
          path: dist/storybook

  release:
    name: Release
    if: github.event.pull_request.merged == true && github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Waits for a required reviewer before publishing. npm's trusted publisher
    # for `slab-elements` names this environment, so keep the two in sync.
    environment: release
    needs:
      - build
    permissions:
      # https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
      contents: write
      id-token: write
    steps:
      # Changesets pushes the release's tags with its own credentials, from
      # `GITHUB_TOKEN`, so checkout's aren't needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/actions/pnpm
      - name: Download Package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      - name: Publish to NPM
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
        # No `NPM_TOKEN`: npm trusted publishing exchanges this job's OIDC token
        # (`id-token: write`) for a short-lived publish token.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
