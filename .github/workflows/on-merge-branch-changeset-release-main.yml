name: On Merge Branch "changeset-release/main"

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -eu -o pipefail {0}

jobs:
  install-dependencies:
    name: Install
    if: github.event.pull_request.merged == true && github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm

  build:
    name: Build
    if: github.event.pull_request.merged == true && github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    needs:
      - install-dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - run: pnpm start
        env:
          NODE_ENV: production
      - name: Upload Storybook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook
          path: dist/storybook

  release:
    name: Release
    if: github.event.pull_request.merged == true && github.head_ref == 'changeset-release/main'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Waits for a required reviewer before publishing. npm's trusted publisher
    # for `slab-elements` names this environment, so keep the two in sync.
    environment: release
    needs:
      - install-dependencies
    permissions:
      # https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - run: pnpm start
        env:
          NODE_ENV: production
      - name: Publish to NPM
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
        # No `NPM_TOKEN`: npm trusted publishing exchanges this job's OIDC token
        # (`id-token: write`) for a short-lived publish token.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
