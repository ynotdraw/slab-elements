# Keeps the repository's dependencies current: the pinned actions, and the npm
# packages of Slab and of the site. Every action is pinned to a commit, with its
# version in a comment, since a tag can be moved to other code.
#
# Updates wait a week after a release, as `minimumReleaseAge` does for pnpm,
# since a compromised release is usually caught within days. Security updates,
# once they are turned on in the repository's settings, don't wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/pnpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Changesets action v2 needs Changesets CLI v3, which is still a
      # prerelease. Remove this when moving to CLI v3.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns:
          - '*'

  # The root is the pnpm workspace, and its one lockfile covers `site` as well,
  # so the root alone updates both. Listing `site` too opened a second pull
  # request for each of its updates, without the lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Minor and patch updates come together in one pull request a week. A
    # major gets a pull request of its own, since it may need changes.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
