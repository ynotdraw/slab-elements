# Keeps the repository's dependencies current: the pinned actions, and the npm
# packages of Slab and of the site. Every action is pinned to a commit, with its
# version in a comment, since a tag can be moved to other code.
#
# Updates wait a week after a release, as `minimumReleaseAge` does for pnpm,
# since a compromised release is usually caught within days. Security updates,
# once they are turned on in the repository's settings, don't wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/pnpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Changesets action v2 needs Changesets CLI v3, which is still a
      # prerelease. Remove this when moving to CLI v3.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns:
          - '*'

  # The root is the pnpm workspace, with `site` as a package of its own. Each
  # gets its own pull requests so a site update doesn't hold up Slab's.
  - package-ecosystem: npm
    directories:
      - /
      - /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Minor and patch updates come together, one pull request a week for
    # each package. A major gets a pull request of its own, since it may
    # need changes.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
